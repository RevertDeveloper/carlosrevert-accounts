<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="faviconTitle faviconDesc">
  <title id="faviconTitle">Transcriptor</title>
  <desc id="faviconDesc">Icono de marca con barras de onda de voz</desc>
  <defs>
    <linearGradient id="surfaceGradient" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef6ff" />
      <stop offset="1" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="frameGradient" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#surfaceGradient)" />
  <rect x="8.75" y="8.75" width="46.5" height="46.5" rx="13.25" fill="none" stroke="url(#frameGradient)" stroke-width="1.5" />
  <g filter="url(#shadow)">
    <rect x="19" y="22" width="7" height="20" rx="3.5" fill="#2563eb" />
    <rect x="28.5" y="16" width="7" height="32" rx="3.5" fill="url(#accentGradient)" />
    <rect x="38" y="25" width="7" height="14" rx="3.5" fill="#0f172a" />
  </g>
</svg>
