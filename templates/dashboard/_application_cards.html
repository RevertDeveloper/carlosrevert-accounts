<div class="app-grid">
  {% for application in applications %}
    <a class="app-card" href="{{ application.base_url }}">
      <span class="app-icon" aria-hidden="true">
        <img src="{{ application.favicon_url }}" alt="" width="32" height="32" loading="lazy" decoding="async">
      </span>
      <span class="app-copy"><strong>{{ application.name }}</strong><span>{% if application.consumes_quota %}Usa tu cuota diaria{% else %}Acceso incluido{% endif %}</span></span>
      <svg class="app-arrow" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  {% empty %}<p class="empty-card">No hay aplicaciones disponibles en este momento.</p>{% endfor %}
</div>
